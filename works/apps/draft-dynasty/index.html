function newGame(mi,name){

function newDraft(order){
  const act=new Set(Object.values(G.P).filter(p=>p.real>=0).map(p=>p.real));
  const cand=DB.map((_,i)=>i).filter(i=>!act.has(i)).sort(()=>R()-.5).slice(0,72);
  G.draft={pool:cand.map(mkReal),order,n:0,log:[]};

}
function cnt(t,pos){return t.roster.filter(id=>P(id).pos===pos).length}
function doPick(t,p){
  const d=G.draft;d.pool=d.pool.filter(x=>x!==p);addTo(t,p);
  d.log.unshift(`第${Math.floor(d.n/12)+1}輪 ${t.name}：${p.n}（${p.pos}）`);d.n++;
  if(t.id===G.my)news(`選秀第${Math.ceil(d.n/12)}輪指名 ${p.n}。`);
}
function aiPick(t){
  const d=G.draft;let best=null,bs=-1;
  for(const p of d.pool){const s=pot(p)+rf(-6,6)+(cnt(t,p.pos)<MIN[p.pos]?8:0);if(s>bs){bs=s;best=p}}
  doPick(t,best);
}
function advanceDraft(auto){
  const d=G.draft;
  while(d.n<ROUNDS*12&&d.pool.length){
    const t=G.teams[d.order[d.n%12]];
    if(t.id===G.my){if(!auto)return;doPick(t,d.pool.slice().sort((a,b)=>b.sc-a.sc)[0])}
    else aiPick(t);
  }
  G.phase='pre';d.pool=[];
  news('選秀結束。調整名單後即可開幕。');
}

function lineup(t){
  const ps=t.roster.map(P),bats=ps.filter(p=>!isP(p)).sort((a,b)=>ovr(b)-ovr(a)),pit=ps.filter(isP);
  const lu=[],take=(pos,n)=>{for(const p of bats){if(n&&p.pos===pos&&!lu.includes(p)){lu.push(p);n--}}};
  take('C',1);take('IF',4);take('OF',3);
  const off=p=>p.cur[0]*.5+p.cur[1]*.4+p.cur[2]*.1;
  const rest=bats.filter(p=>!lu.includes(p)).sort((a,b)=>off(b)-off(a));
  while(lu.length<9&&rest.length)lu.push(rest.shift());
  const D=lu.reduce((s,p)=>s+p.cur[3],0)/Math.max(1,lu.length);
  const o=lu.slice().sort((a,b)=>off(b)-off(a));
  const ord=[o[2],o[3],o[0],o[1],...o.slice(4)].filter(Boolean);
  const byO=(a,b)=>ovr(b)-ovr(a);
  let sp=pit.filter(p=>p.pos==='SP').sort(byO).slice(0,5);
  const rpv=p=>ovrOf('RP',p.cur);
  let rp=pit.filter(p=>!sp.includes(p)).sort((a,b)=>rpv(b)-rpv(a));
  while(sp.length<5&&rp.length>3)sp.push(rp.pop());
  rp=rp.slice(0,7);if(!rp.length)rp=sp.slice(-1);
  return {lu:ord,sp,rp,D,ids:new Set([...ord,...sp,...rp].map(p=>p.id))};
}
function simGame(h,a,L,count){
  const ctx=(t,home)=>{const l=L[t.id],sp=l.sp[(t.w+t.l+t.t)%l.sp.length];sp.st.g++;
    return {t,l,home,i:0,r:0,p:sp,isSP:true,bf:0,lim:18+(sp.cur[3]-50)*.25,rc:0,pi:0,cl:false,wp:null,lp:null}};
  const H=ctx(h,true),A=ctx(a,false);
  const half=(B,Pt,inn)=>{
    if(inn>1){
      let ch=Pt.isSP?(Pt.bf>=Pt.lim||Pt.rc>=5):true;
      if(ch){const rp=Pt.l.rp,lead=Pt.r-B.r;let nx;
        if(inn>=9&&lead>0&&lead<=3&&!Pt.cl){nx=rp[0];Pt.cl=true}
        else nx=rp.length>1?rp[1+(Pt.pi++ +Pt.t.w+Pt.t.l)%(rp.length-1)]:rp[0];
        if(nx!==Pt.p){Pt.p=nx;nx.st.g++}Pt.isSP=false;Pt.rc=0;Pt.bf=0;}
    }
    let outs=0,bs=[null,null,null];
    const score=(n,b)=>{if(!n)return;const before=B.r;B.r+=n;b.st.rbi+=n;Pt.p.st.er+=n;Pt.rc+=n;
      if(before<=Pt.r&&B.r>Pt.r){B.wp=B.p;Pt.lp=Pt.p}
      if(before<Pt.r&&B.r===Pt.r){Pt.wp=null;B.lp=null}};
    while(outs<3){
      const b=B.l.lu[B.i%B.l.lu.length],p=Pt.p;B.i++;Pt.bf++;
      const [c,pw,s]=b.cur,[v,ct,br]=p.cur,q=(v+ct+br)/3-(Pt.isSP&&Pt.bf>Pt.lim?6:0);
      b.st.pa++;
      const pK=clamp(.19+((v+br)/2-c)*.004,.05,.4),pBB=clamp(.08+(65-ct)*.0025+(pw-65)*.0005,.02,.2),
        pHR=clamp(.022+(pw-65)*.0014-(q-65)*.0006,.002,.09);
      const r=R();let onFirst=false;
      if(r<pK){b.st.ab++;b.st.k++;p.st.pk++;outs++;p.st.o++}
      else if(r<pK+pBB){b.st.bb++;p.st.pbb++;
        if(bs[0]){if(bs[1]){if(bs[2])score(1,b);bs[2]=bs[1]}bs[1]=bs[0]}bs[0]=b;onFirst=true}
      else if(r<pK+pBB+pHR){b.st.ab++;b.st.h++;b.st.hr++;p.st.ph++;score(1+bs.filter(Boolean).length,b);bs=[null,null,null]}
      else{b.st.ab++;
        const bab=clamp(.295+(c-65)*.0025-(q-65)*.0015-(Pt.l.D-65)*.001+(s-65)*.0005,.18,.42);
        if(R()<bab){b.st.h++;p.st.ph++;const x=R(),p3=.015+(s-65)*.0006,p2=.19+(pw-65)*.002;
          if(x<p3){score(bs.filter(Boolean).length,b);bs=[null,null,b]}
          else if(x<p3+p2){let n=0;if(bs[2])n++;if(bs[1])n++;let third=null;if(bs[0]){if(R()<.4)n++;else third=bs[0]}score(n,b);bs=[null,b,third]}
          else{let n=0;const nb=[b,null,null];if(bs[2])n++;if(bs[1]){if(R()<.6)n++;else nb[2]=bs[1]}
            if(bs[0]){if(!nb[2]&&R()<.3)nb[2]=bs[0];else nb[1]=bs[0]}score(n,b);bs=nb;onFirst=true}
        }else{outs++;p.st.o++;
          if(outs<3){if(bs[0]&&R()<.12){outs++;p.st.o++;bs[0]=null}else if(bs[2]&&R()<.3){score(1,b);bs[2]=null}}}
      }
      if(onFirst&&outs<3&&bs[0]===b&&!bs[1]&&s>72&&R()<(s-70)*.022){
        if(R()<.72){bs[1]=b;bs[0]=null;b.st.sb++}else{bs[0]=null;outs++;p.st.o++}}
      if(inn>=9&&B.home&&B.r>Pt.r)break;
    }
  };
  for(let inn=1;inn<=12;inn++){
    half(A,H,inn);if(inn>=9&&H.r>A.r)break;
    half(H,A,inn);if(inn>=9&&H.r!==A.r)break;
  }
  if(count){h.rs+=H.r;h.ra+=A.r;a.rs+=A.r;a.ra+=H.r}
  if(H.r===A.r){if(count){h.t++;a.t++}return null}
  const W=H.r>A.r?H:A,Lo=W===H?A:H;
  if(count){W.t.w++;Lo.t.l++}
  (W.wp||W.p).st.w++;(Lo.lp||Lo.p).st.l++;
  if(W.p!==(W.wp||W.p)&&W.r-Lo.r<=3)W.p.st.sv++;
  return W.t;
}
function pairs(day){
  const r=day%11,cy=Math.floor(day/11),a=[0];
  for(let i=0;i<11;i++)a.push(1+(i+r)%11);
  const out=[];for(let i=0;i<6;i++){let x=a[i],y=a[11-i];if((cy+i)%2)[x,y]=[y,x];out.push([x,y])}
  return out;
}
function simDays(n){
  const L=G.teams.map(lineup);
  while(n-->0&&G.day<DAYS){for(const [x,y] of pairs(G.day))simGame(G.teams[x],G.teams[y],L,true);G.day++}
  if(G.day>=DAYS)news(`第${G.year}年例行賽結束：${my().w}勝${my().l}敗${my().t}和。`);

const stand=lg=>G.teams.filter(t=>t.lg===lg).sort((a,b)=>pct(b)-pct(a)||(b.rs-b.ra)-(a.rs-a.ra));

function grow(p,lvl){
  for(let i=0;i<4;i++){
    if(p.age<=27){const rate=.26+.04*lvl+(p.focus===i?.15:p.focus>=0?-.03:0)+rf(-.06,.1);
      p.cur[i]=Math.min(p.pk[i],Math.round(p.cur[i]+Math.max(0,(p.pk[i]-p.cur[i])*rate)))}
    else if(p.age>=31){const sp=!isP(p)&&i===2?1.5:1;p.cur[i]=Math.max(30,Math.round(p.cur[i]-(rf(0,2.2)+(p.age-31)*.45)*sp))}
  }
  p.age++;p.yrs++;
}
function leaders(){
  const all=Object.values(G.P),top=(arr,f)=>arr.slice().sort((a,b)=>f(b)-f(a))[0];
  const qb=all.filter(p=>p.st.pa>=380),qp=all.filter(p=>p.st.o>=380);
  const o=[],nm=p=>`${p.n}（${G.teams[p.tm].name}）`;
  let x;
  if((x=top(qb,p=>p.st.h/p.st.ab)))o.push(`打擊王 ${nm(x)} ${avg(x)}`);
  if((x=top(all,p=>p.st.hr)))o.push(`全壘打王 ${nm(x)} ${x.st.hr}轟`);
  if((x=top(qp,p=>-era(p))))o.push(`防禦率王 ${nm(x)} ${era(x).toFixed(2)}`);
  if((x=top(all,p=>p.st.w)))o.push(`勝投王 ${nm(x)} ${x.st.w}勝`);
  return o;
}
function endSeason(){
  const m=my(),aw=leaders(),a=stand(0)[0],b=stand(1)[0];
  const rank=stand(m.lg).indexOf(m)+1,rec=`${m.w}勝${m.l}敗${m.t}和`;
  const L=G.teams.map(lineup);let wa=0,wb=0;
  while(wa<4&&wb<4){const w=simGame(a,b,L,false);if(w===a)wa++;else if(w===b)wb++}
  const ch=wa>wb?a:b;
  const pay=m.roster.reduce((s,id)=>s+P(id).sal,0),upk=(m.fac.train+m.fac.scout+m.fac.stadium)*2;
  const rev=22+m.w*.22+m.fac.stadium*4+m.pop*.1+(ch===m?8:0);
  m.cash=Math.round((m.cash+rev-pay-upk)*10)/10;
  m.pop=clamp(Math.round(m.pop+(pct(m)-.5)*40+(ch===m?10:0)+(m.cash<0?-5:0)),10,100);
  G.fin={rev:Math.round(rev*10)/10,pay:Math.round(pay*10)/10,upk};
  G.hist.unshift({y:G.year,ch:ch.name,sc:`${Math.max(wa,wb)}–${Math.min(wa,wb)}`,rec,rank,lg:LG[m.lg],aw});
  news(`第${G.year}年總冠軍：${ch.name}。本季收入 ${G.fin.rev} 億、薪資 ${G.fin.pay} 億、設施維護 ${upk} 億。`);
  const order=G.teams.slice().sort((x,y)=>pct(x)-pct(y)).map(t=>t.id);
  for(const t of G.teams){
    const me=t.id===G.my;
    for(const id of t.roster.slice()){const p=P(id);grow(p,me?t.fac.train:2);p.sal=salFor(p);const o=ovr(p);
      if(p.age>=41||(p.age>=36&&o<70)||(p.age>=33&&o<58)){if(me)news(`${p.n}（${p.age-1}歲）引退。`);drop(t,p)}}
    if(!me){
      const val=p=>ovr(p)-Math.max(0,p.age-30)*2+(p.age<25?(pot(p)-ovr(p))*.6:0);
      const ps=t.roster.map(P).sort((x,y)=>val(x)-val(y));
      for(const p of ps){if(t.roster.length<=26)break;if(cnt(t,p.pos)>MIN[p.pos])drop(t,p)}
      for(const k in MIN)while(cnt(t,k)<MIN[k])addTo(t,mkFill(k,56,74));
    }
  }
  G.tp=3+m.fac.train;
  G.fa=['SP','SP','RP','RP','C','IF','IF','IF','OF','OF'].map(k=>mkFill(k,58,78));
  G.year++;G.day=0;newDraft(order);
}
function openSeason(){
  const m=my(),ps=m.roster.map(P);

  if(ps.filter(p=>!isP(p)).length<9)return '野手不足 9 人，請到「經營」簽下自由球員。';
  if(ps.filter(isP).length<8)return '投手不足 8 人，請到「經營」簽下自由球員。';
  for(const t of G.teams){t.w=t.l=t.t=t.rs=t.ra=0}
  for(const p of Object.values(G.P))p.st=newStat();
  G.phase='season';G.day=0;news(`第${G.year}年球季開幕。`);return '';
}

const BC={on:false,q:[],line:'',n:0,wl:null};

const valOf=p=>ovr(p)-Math.max(0,p.age-30)*2+(p.age<25?(pot(p)-ovr(p))*.6:0);
function autoFix(){
  const m=my();
  while(m.roster.length>CAP){const p=m.roster.map(P).sort((a,b)=>valOf(a)-valOf(b))[0];drop(m,p)}
  while(m.roster.map(P).filter(p=>!isP(p)).length<9)addTo(m,mkFill('IF',56,70));
  while(m.roster.map(P).filter(isP).length<8)addTo(m,mkFill('RP',56,70));
  for(const [k,n] of FAC){const c=12*(m.fac[k]+1);if(m.fac[k]<5&&m.cash>=c+20){m.cash=Math.round((m.cash-c)*10)/10;m.fac[k]++;say(`球團升級了${n}，現在是第${m.fac[k]}級。`);break}}
}
function bcStep(){
  const m=my();
  if(G.phase==='draft'){advanceDraft(true);
    const nw=m.roster.map(P).filter(p=>p.yrs===0&&p.real>=0);
    say(`第${G.year}年選秀會結束。我們指名了${nw.map(p=>p.n).join('、')}。`);
    const b=nw.sort((a,b)=>b.sc-a.sc)[0];if(b)say(`球探最看好的是${b.n}，${b.age}歲，估計潛力${grade(b.sc)}級。`);}
  else if(G.phase==='pre'){autoFix();const e=openSeason();if(e){say(e);BC.on=false}else say(`第${G.year}年球季開幕。`)}
  else if(G.day<DAYS){simDays(24);BC.n++;
    const rk=stand(m.lg).indexOf(m)+1;
    say(`打完${G.day}場，${m.name}${m.w}勝${m.l}敗，${LG[m.lg]}第${rk}名。`);
    const ps=m.roster.map(P);
    if(BC.n%2){const h=ps.slice().sort((a,b)=>b.st.hr-a.st.hr)[0];say(`隊上全壘打最多的是${h.n}，${h.st.hr}支，打點${h.st.rbi}分。`)}
    else{const w=ps.filter(isP).sort((a,b)=>b.st.w-a.st.w)[0];say(`投手方面，${w.n}拿下${w.st.w}勝，防禦率${era(w).toFixed(2)}。`)}
    if(G.day>=DAYS)say('例行賽全部結束，接著進行總冠軍賽。');}
  else{endSeason();const h=G.hist[0];
    say(`第${h.y}年總冠軍是${h.ch}，系列賽${h.sc.replace('–','比')}。`);
    say(`我們的成績是${h.lg}第${h.rank}名，${h.rec}。`);
    h.aw.forEach(a=>say(a.replace(/（.*?）/,'，').replace(' .','零點')+'。'));
    say(`球團資金剩下${m.cash}億，人氣${m.pop}。`);
    const y=m.roster.map(P).filter(p=>p.age<=24).sort((a,b)=>ovr(b)-ovr(a))[0];
    if(y)say(`隊上最受期待的年輕球員是${y.n}，${y.age}歲，總評${ovr(y)}。`);}
}
function pump(){
  if(!BC.on)return;
  if(!BC.q.length)bcStep();
  if(!BC.q.length){render();return}
  const t=BC.q.shift();BC.line=t;view='home';render();
  let done=false;const tm=setTimeout(()=>nx(),t.length*450+4000);
  function nx(){if(done)return;done=true;clearTimeout(tm);setTimeout(pump,400)}
  try{const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.onend=nx;u.onerror=()=>setTimeout(nx,t.length*200+1000);speechSynthesis.speak(u)}
  catch(e){setTimeout(nx,t.length*200+1000)}
}
function bcToggle(){
  BC.on=!BC.on;BC.q=[];

  if(BC.on){BC.n=0;say(`廣播模式開始，為您播報${my().name}的球季。`);
    try{navigator.wakeLock.request('screen').then(w=>BC.wl=w).catch(()=>{})}catch(e){}
    pump()}
  else{BC.line='';try{BC.wl&&BC.wl.release()}catch(e){}}
}

function vHist(){
  return `<div class="panel"><h2>球團史</h2>${G.hist.length?`<div class="scroll"><table><tr><th>年度</th><th class="l">總冠軍</th><th class="l">我的戰績</th><th class="l">個人獎項</th></tr>
   ${G.hist.map(h=>`<tr><td>第${h.y}年</td><td class="l">${h.ch}（${h.sc}）</td><td class="l">${h.lg}第 ${h.rank} 名・${h.rec}</td><td class="l small" style="white-space:normal">${h.aw.join('、')}</td></tr>`).join('')}</table></div>`:'<p class="muted">打完第一個球季後，這裡會記錄每年的總冠軍、戰績與獎項。</p>'}
   <div class="row" style="margin-top:14px"><button class="warn" data-a="reset">${armed==='reset'?'確定刪除存檔並重新開始':'重新開始'}</button></div></div>`;
}
function act(a,v,el){
  msg='';const m=G&&my();
  if(a!=='rel'&&a!=='reset')armed=null;
  if(BC.on&&a!=='bc')return;
  if(a==='new'){const nm=$('tname').value.trim();newGame(+v,nm);viewTeam=+v;view='draft'}
  else if(a==='bc'){bcToggle();return}
  else if(a==='tab')view=v;
  else if(a==='team')viewTeam=+el.value;
  else if(a==='pick'){const p=G.draft.pool.find(x=>x.id==v);if(p){doPick(m,p);advanceDraft();if(G.phase!=='draft')view='home'}}
  else if(a==='auto'){advanceDraft(true);view='home'}
  else if(a==='open'){msg=openSeason()}
  else if(a==='sim')simDays(+v);
  else if(a==='end'){endSeason();view='draft'}
  else if(a==='focus'){P(v).focus=+el.value}
  else if(a==='sp'){const p=P(v);if(G.tp>0){G.tp--;const up=(i,n)=>{p.cur[i]=Math.min(99,p.pk[i]+4,p.cur[i]+n);if(p.cur[i]>p.pk[i])p.pk[i]=p.cur[i]};
    if(p.focus>=0)up(p.focus,3);else for(let i=0;i<4;i++)up(i,1);msg=`${p.n} 完成特訓。`}}
  else if(a==='rel'){if(armed==v){const p=P(v);if(G.phase==='season'&&m.roster.length<=20)msg='球季中名單不可少於 20 人。';else{drop(m,p);news(`釋出 ${p.n}。`)}armed=null}else armed=+v}
  else if(a==='up'){const c=12*(m.fac[v]+1);if(m.cash>=c){m.cash=Math.round((m.cash-c)*10)/10;m.fac[v]++;news(`${FAC.find(f=>f[0]===v)[1]}升級到 Lv.${m.fac[v]}。`)}}
  else if(a==='sign'){const p=G.fa.find(x=>x.id==v);if(m.roster.length>=CAP)msg=`名單已滿 ${CAP} 人。`;else if(m.cash<p.sal)msg='資金不足。';
    else{m.cash=Math.round((m.cash-p.sal)*100)/100;G.fa=G.fa.filter(x=>x!==p);addTo(m,p);news(`簽下自由球員 ${p.n}。`)}}
  else if(a==='reset'){if(armed==='reset'){try{localStorage.removeItem('dd1')}catch(e){}G=null;armed=null;view='home'}else armed='reset'}
  render();
}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-a]');if(b)act(b.dataset.a,b.dataset.v,b)});
document.addEventListener('change',e=>{const s=e.target.closest('select[data-a]');if(s)act(s.dataset.a,s.dataset.v,s)});
load();if(G)viewTeam=G.my;render();
</script>

</body></html>
