<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>注音大冒險｜JIO 軟體工坊</title><meta name="description" content="闖關式注音練習遊戲，有玩家排行榜。"><link rel="icon" href="../../../icon-64.png"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700&family=Press+Start+2P&display=swap">
<style>
/* 版面：一欄式，生字簿綠格子當底；每個國字右邊直排注音，像課本 */
:root{
  --paper:#E3DBCA;
  --grid:#D5CBB6;
  --card:#F4EFE3;
  --ink:#2E2B24;
  --ink-soft:#5B564A;
  --line:#C9BDA4;
  --blue:#1E5BA8;
  --blue-dk:#14417A;
  --blue-soft:#E6EEF8;
  --orange:#B4460E;
  --orange-soft:#FBEDE3;
  --red:#C8302A;
  --red-soft:#FBE7E5;
  --green:#257447;
  --green-soft:#E3F2E8;
  --gold:#E3A015;
  --f-kai:'LXGW WenKai TC','BiauKai','DFKai-SB','標楷體','Kaiti TC',serif;
  --f-sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background-color:var(--paper);
  background-image:radial-gradient(rgba(110,90,60,.10) 1px,transparent 1.4px),radial-gradient(rgba(255,255,255,.18) 1px,transparent 1.6px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:9px 9px,13px 13px,32px 32px,32px 32px;
  background-position:0 0,5px 7px,0 0,0 0;
  color:var(--ink);
  font-family:var(--f-sans);
  font-size:16px;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.wrap{
  max-width:880px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px 48px;
  display:flex;flex-direction:column;gap:22px;
}

/* 國字＋直排注音 */
.zy{display:inline-flex;align-items:center;gap:.05em;font-family:var(--f-kai);vertical-align:middle}
.zy .zc{display:block;line-height:1}
.zy .zp{position:relative;display:flex;flex-direction:column;align-items:center;font-size:.3em;line-height:1.02;font-weight:400;padding-right:.15em}
.zy .tn{position:absolute;right:-.75em;bottom:.51em;transform:translateY(50%)}
.zy .lt{position:absolute;top:-1em;left:50%;transform:translateX(-50%)}
.zy .zq{display:grid;place-items:center;width:1.3em;height:2.6em;border:2px dashed var(--ink-soft);border-radius:4px;color:var(--ink-soft);font-weight:700}
/* 一般文字列：注音大一點，看得清楚 */
.tt{display:inline-flex;flex-wrap:wrap;align-items:center;gap:.25em .42em;line-height:1}
.tt .zy .zp{font-size:.48em}
.tt .zy{margin-right:.3em}
.tt .p{font-family:var(--f-kai)}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;gap:14px;font-size:38px;font-weight:700}
.starbox{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 14px 6px 10px;font-weight:700;font-variant-numeric:tabular-nums}
.starbox svg{width:22px;height:22px}

.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font-size:21px;font-weight:700}
.intro{margin:0;font-size:20px}

/* 選音組 */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gchip{position:relative;display:block}
.gchip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;width:100%;height:100%}
.gchip span.box{display:flex;flex-direction:column;gap:8px;padding:12px;border:2px solid var(--line);border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--line);min-height:96px;justify-content:center}
.gchip b{font-family:var(--f-kai);font-size:22px}
.gchip small{color:var(--ink-soft);font-size:15px}
.gchip input:checked+span.box{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 3px 0 var(--blue)}
.gchip input:focus-visible+span.box{outline:3px solid var(--blue);outline-offset:3px}
.gchip input:disabled+span.box{opacity:.55}

/* 遊戲卡 */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:14px;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.mode:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.mode.learn{background:var(--green-soft);border-color:var(--green);box-shadow:0 5px 0 var(--green)}
.mode svg{width:44px;height:44px}
.mode b{font-size:24px}
.mode small{color:var(--ink-soft);font-size:15px}

.toggles{display:flex;flex-wrap:wrap;gap:12px 22px}
.tg{display:flex;align-items:center;gap:8px;font-size:17px;cursor:pointer}
.tg input{width:22px;height:22px;accent-color:var(--blue)}
.note{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.6}
.note.warn{color:var(--red)}

/* 遊戲畫面 */
.gbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.back{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;min-height:52px;font-size:17px}
.gtitle{font-size:26px;font-weight:700;flex:1;min-width:0}
.pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-variant-numeric:tabular-nums;font-size:17px}

.prompt{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:16px 18px;box-shadow:0 5px 0 var(--ink)}
.speak{width:68px;height:68px;border-radius:50%;border:none;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 0 var(--blue-dk)}
.speak:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-dk)}
.speak svg{width:34px;height:34px}
.pbtns{display:flex;flex-direction:column;align-items:center;gap:8px}
.slow{border:2px solid var(--blue);background:var(--blue-soft);color:var(--blue);border-radius:12px;padding:6px 10px;font-size:15px;font-weight:700;min-height:44px}
.pic{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-size:84px;line-height:1}
.pic:empty{display:none}
.tfrow{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center}
.pword{display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-width:0}
.pchar{font-size:76px;font-weight:700}
.pctx{font-size:20px;color:var(--ink-soft)}
.pcue{font-size:18px;color:var(--red);font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pcue .sym{font-family:var(--f-kai);font-size:26px}
.pcue.good{color:var(--green)}

/* 找找看 */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:480px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{min-height:80px;border:2px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 4px 0 var(--line);font-family:var(--f-kai);font-size:30px;font-weight:700;letter-spacing:2px;transition:transform .25s,opacity .25s}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tile.gone{animation:none;transform:scale(.4) rotate(-12deg);opacity:0;pointer-events:none}
.tile.hint{border-color:var(--gold);box-shadow:0 4px 0 var(--gold);animation:pulse 1s ease-in-out infinite}
.shake{animation:shake .38s}
.wrongflash{border-color:var(--red)!important;box-shadow:0 4px 0 var(--red)!important;color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pulse{50%{transform:scale(1.06)}}

/* 氣球：天空、太陽、飄動的雲，氣球邊升邊搖 */
.sky{position:relative;height:clamp(240px,calc(100dvh - 330px),420px);overflow:hidden;border-radius:20px;border:2px solid var(--line);background:linear-gradient(#A9C8DA 0%,#C9DCE4 55%,#E6E4D8 100%)}
.sun{position:absolute;top:22px;right:28px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#FFF3B0,#FFD23F 60%,#F5B700);box-shadow:0 0 0 10px rgba(255,220,90,.25),0 0 40px 18px rgba(255,220,90,.35);animation:sunp 3s ease-in-out infinite}
@keyframes sunp{50%{box-shadow:0 0 0 16px rgba(255,220,90,.18),0 0 54px 24px rgba(255,220,90,.3)}}
.cloud{position:absolute;width:120px;height:38px;background:#fff;border-radius:40px;opacity:.9;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:56px;height:56px;left:16px;top:-26px}
.cloud::after{width:44px;height:44px;left:58px;top:-18px}
.cloud.c1{top:60px;animation-duration:38s;animation-delay:-6s}
.cloud.c2{top:150px;transform:scale(.7);animation-duration:52s;animation-delay:-30s;opacity:.75}
.cloud.c3{top:250px;transform:scale(.85);animation-duration:44s;animation-delay:-18s;opacity:.8}
@keyframes drift{from{left:-160px}to{left:105%}}
.bwrap{position:absolute;inset:0}
.balloon{position:absolute;top:100%;width:100px;height:160px;margin-left:-50px;border:none;background:transparent;padding:0;animation:rise var(--d) linear infinite;animation-delay:var(--dl)}
.balloon .bsw{display:block;transform-origin:50% 100%;animation:sway var(--sw) ease-in-out infinite alternate}
@keyframes sway{from{transform:translateX(-10px) rotate(-6deg)}to{transform:translateX(10px) rotate(6deg)}}
.balloon .bb{display:grid;place-items:center;width:100px;height:110px;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55) 0 12%,rgba(255,255,255,0) 30%),var(--bg);color:var(--fg);font-family:var(--f-kai);font-size:27px;font-weight:700;box-shadow:inset -10px -14px 0 rgba(0,0,0,.14),0 6px 10px rgba(0,0,0,.12);position:relative;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.balloon .bb::after{content:"";position:absolute;bottom:-9px;left:50%;margin-left:-8px;border:8px solid transparent;border-top-color:var(--bg)}
.balloon .str{display:block;width:2px;height:40px;margin:7px auto 0;background:var(--ink-soft);opacity:.55;transform-origin:top;animation:strw 1.2s ease-in-out infinite alternate}
@keyframes strw{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.balloon.pop{animation:none}
.balloon.pop .bsw{animation:popb .22s ease-out forwards}
@keyframes popb{60%{transform:scale(1.35)}100%{transform:scale(1.6);opacity:0}}
.balloon.miss .bsw{animation:deflate .9s ease-in forwards}
@keyframes deflate{30%{transform:scale(.9,1.1) rotate(-20deg)}60%{transform:scale(.7) rotate(25deg)}100%{transform:scale(.55) rotate(-10deg) translateY(30px);opacity:.3}}
.sky.paused .balloon{animation-play-state:paused}
.popword{position:absolute;font-family:'Press Start 2P',var(--f-sans);font-size:20px;color:#fff;text-shadow:2px 2px 0 var(--red),-2px -2px 0 var(--red),2px -2px 0 var(--red),-2px 2px 0 var(--red);pointer-events:none;animation:popw .7s ease-out forwards}
@keyframes popw{from{transform:translate(-50%,-50%) scale(.4)}60%{transform:translate(-50%,-70%) scale(1.2)}to{transform:translate(-50%,-90%) scale(1);opacity:0}}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-600px)}}

#game.m-balloon{gap:10px}
#game.m-balloon .prompt{padding:8px 12px;gap:12px}
#game.m-balloon .pchar{font-size:52px}
#game.m-balloon .pic{font-size:54px}
#game.m-balloon .speak{width:54px;height:54px}
#game.m-balloon .pword{gap:4px}
#game.m-balloon .pctx{font-size:17px}

/* 對不對 */
.tfwrap{display:flex;flex-direction:column;gap:14px}
.tfcard{display:flex;flex-direction:column;align-items:center;gap:14px;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:22px 18px;transition:border-color .2s}
.tfcard.right{border-color:var(--green)}
.tfcard.wrong{border-color:var(--red)}
.tfword{font-size:110px;font-weight:700;padding-right:.3em;padding-top:.15em}
.tfmsg{min-height:34px;font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.tfmsg.ok{color:var(--green)}.tfmsg.no{color:var(--red)}
.timer{height:12px;border-radius:999px;background:var(--card);border:2px solid var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--gold);transition:width .25s linear}
.oxrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ox{min-height:100px;border-radius:20px;border:3px solid;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px}
.ox svg{width:46px;height:46px}
.ox.o{background:var(--green-soft);border-color:var(--green);color:var(--green);box-shadow:0 5px 0 var(--green)}
.ox.x{background:var(--red-soft);border-color:var(--red);color:var(--red);box-shadow:0 5px 0 var(--red)}
.ox:active{transform:translateY(4px);box-shadow:none}
.ox:disabled{opacity:.6}

/* 翻翻卡 */
.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;max-width:640px;margin:0 auto;width:100%}
@media (max-width:560px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{aspect-ratio:3/4;max-width:100%;border:none;padding:0;background:transparent;perspective:600px}
.card .in{position:relative;display:block;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.card.up .in{transform:rotateY(180deg)}
.card .face{position:absolute;inset:0;display:grid;place-items:center;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--ink)}
.card .bk{background:var(--blue);color:#fff;background-image:linear-gradient(rgba(255,255,255,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.18) 1px,transparent 1px);background-size:12px 12px;font-family:var(--f-kai);font-size:26px;font-weight:700}
.card .ft{background:var(--card);transform:rotateY(180deg);font-family:var(--f-kai);font-weight:700}
.card .ft.c{font-size:38px}
.card .ft.z{font-size:21px;letter-spacing:1px;color:var(--orange)}
.card.done{animation:pulse .5s ease-in-out 1}
.card.done .ft{background:var(--green-soft);border-color:var(--green)}

/* 連連看 */
.match{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 56px}
.match svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mcol{display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.mbtn{min-height:76px;border:2px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 4px 0 var(--line);font-family:var(--f-kai);font-weight:700;animation:bounceIn .5s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes bounceIn{from{opacity:0;transform:scale(.3) translateY(20px)}to{opacity:1;transform:none}}
.mbtn.paired{animation:pairpop .45s ease-out}
@keyframes pairpop{40%{transform:scale(1.12)}}
.match svg.lines line.new{stroke-dasharray:1;stroke-dashoffset:1;animation:drawl .45s ease-out forwards}
@keyframes drawl{to{stroke-dashoffset:0}}
.tile{animation:bounceIn .45s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(var(--i,0) * 50ms)}
.mbtn.l{font-size:44px}
.mbtn.r{font-size:28px;letter-spacing:2px}
.mbtn.sel{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 4px 0 var(--blue)}
.mbtn.paired{background:var(--pc-soft);border-color:var(--pc);box-shadow:0 4px 0 var(--pc);cursor:default}

/* 先認識 */
.learncard{display:flex;flex-direction:column;align-items:center;gap:16px;background:var(--card);border:2px solid var(--green);border-radius:22px;padding:24px 18px;box-shadow:0 5px 0 var(--green);text-align:center}
.lword{font-size:120px;font-weight:700;padding-right:.3em;padding-top:.15em}
.lctx{font-size:24px}
.lnot{font-size:19px;color:var(--ink-soft);display:flex;align-items:center;gap:8px}
.lnot s{font-family:var(--f-kai);font-size:26px;color:var(--red);text-decoration-thickness:3px}
.lcue{font-size:19px;color:var(--green);font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.lcue .sym{font-family:var(--f-kai);font-size:28px}

/* 圈詞：直式，一句一行由上往下，從右邊那一行開始 */
.circles{display:flex;flex-direction:row-reverse;gap:16px;overflow-x:auto;padding-bottom:6px;align-items:flex-start}
.csent{flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 8px}
.crow{display:flex;flex-direction:column;align-items:center}
.syl{display:grid;place-items:center;min-width:76px;min-height:74px;padding:6px 12px 6px 6px;border:3px solid transparent;border-top-width:0;border-bottom-width:0;background:transparent;font-size:48px;border-radius:0}
.syl .zy .zp{font-size:.4em}
.syl .zo .zp{font-size:28px}
.syl.start{background:var(--blue-soft);border-color:var(--blue);border-top-width:3px;border-bottom-width:3px;border-radius:12px}
.syl.in{border-left-color:var(--red);border-right-color:var(--red)}
.syl.cl{border-top:3px solid var(--red);border-radius:30px 30px 0 0}
.syl.cr{border-bottom:3px solid var(--red);border-radius:0 0 30px 30px}
.syl.cl.cr{border-radius:30px}
.syl.bad{background:var(--red-soft)}
.pun{font-size:26px;line-height:1;padding:4px 0}
.pch{font-family:var(--f-kai);font-size:44px}

/* 寫寫看 */
.write{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:560px){.write{grid-template-columns:minmax(0,1fr);justify-items:center}}
#wc{touch-action:none;background:#FBF7EE;border:2px solid var(--ink);border-radius:12px;display:block;max-width:100%;cursor:crosshair}
.wside{display:flex;flex-direction:column;gap:12px;align-items:flex-start;min-width:0}
.winst{margin:0;font-size:20px}
.wres{grid-column:1/-1;min-width:0;width:100%}
.wcard{display:flex;flex-direction:column;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px}
.wtop{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.score{font-size:60px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--blue);line-height:1}
.wstars{display:flex;gap:4px}
.wstars svg{width:38px;height:38px}
.wverdict{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wverdict.ok{color:var(--green)}.wverdict.no{color:var(--red)}
.wverdict .big{font-size:64px;color:var(--ink)}
.wcell{display:inline-flex;padding:4px 10px 4px 4px;border-radius:10px;border:3px solid}
.wcell.ok{border-color:var(--green);background:var(--green-soft)}
.wcell.no{border-color:var(--red);background:var(--red-soft)}
.tips{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:12px;font-size:20px}
.praise{font-size:21px}
.pnote{font-size:14px;color:var(--ink-soft);margin:0}
.rate{display:flex;gap:10px;flex-wrap:wrap}

/* 結果 */
.result{align-items:center;text-align:center;padding:30px 18px}
.bigstars{display:flex;gap:10px}
.bigstars svg{width:72px;height:72px}
.rtitle{font-size:34px;font-weight:700}
.rtext{font-size:20px;color:var(--ink-soft)}

.btn.primary{background:var(--blue);border-color:var(--blue-dk);color:#fff;box-shadow:0 4px 0 var(--blue-dk)}
.btn.go{background:var(--green);border-color:#18532F;color:#fff;box-shadow:0 4px 0 #18532F}

/* 標題列 */
.hright{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hbtn{display:flex;align-items:center;gap:6px;min-height:44px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-weight:700}
.hbtn svg{width:22px;height:22px}
.hbtn.icon{padding:4px 10px}
.hbtn.player{font-family:'Press Start 2P',var(--f-sans);font-size:12px;letter-spacing:1px}
.gtime{display:flex;align-items:center;gap:6px}

/* 登入 */
.loginp{align-items:center;text-align:center;padding:30px 18px;gap:20px}
.loginp h2{font-size:26px}
.who{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.whob{min-width:170px;min-height:84px;border-radius:18px;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);font-family:'Press Start 2P',var(--f-sans);font-size:18px;color:#fff;padding:10px 18px}
.whob:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.whob.c0{background:var(--blue)}.whob.c1{background:var(--orange)}.whob.c2{background:var(--green)}.whob.c3{background:#7A4FA0}
.whob.other{background:var(--card);color:var(--ink);font-family:var(--f-sans);font-size:18px}
.newname{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.newname input{font:inherit;font-size:22px;padding:10px 14px;border:3px solid var(--ink);border-radius:12px;width:220px;max-width:100%}

/* 結算：3D 星星 */
.stars3d{display:flex;gap:22px;justify-content:center;perspective:700px;padding:16px 0 6px}
.sw{position:relative;width:92px;height:92px;opacity:0;transform:scale(0)}
.sw.show{animation:popin .65s cubic-bezier(.2,1.7,.4,1) forwards}
@keyframes popin{0%{opacity:0;transform:scale(0) rotate(-40deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.s3{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(-18deg)}
.sw.on .s3{animation:spin3d 2.4s linear infinite}
@keyframes spin3d{from{transform:rotateY(0) rotateX(8deg)}to{transform:rotateY(360deg) rotateX(8deg)}}
.s3 i{position:absolute;inset:0;transform:translateZ(var(--z))}
.s3 svg{width:100%;height:100%;display:block}
.glow{position:absolute;inset:-35%;border-radius:50%;background:radial-gradient(circle,rgba(255,214,90,.8),rgba(255,214,90,0) 62%);animation:glowp 1.4s ease-in-out infinite}
.sw:not(.on) .glow{display:none}
@keyframes glowp{50%{transform:scale(1.18);opacity:.7}}
.spk{position:absolute;width:18px;height:18px;background:#fff;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);filter:drop-shadow(0 0 4px #FFE680);animation:twinkle 1.3s ease-in-out infinite;transform:scale(0)}
.spk.k1{top:-12px;left:-8px}.spk.k2{top:6px;right:-16px;animation-delay:.45s}.spk.k3{bottom:-10px;left:36px;animation-delay:.9s}

/* 結算：分數 */
.scorebox{display:flex;flex-direction:column;align-items:center;gap:8px}
.slabel{font-family:'Press Start 2P',var(--f-sans);font-size:14px;color:var(--ink-soft);letter-spacing:3px}
.snum{font-family:'Press Start 2P',var(--f-sans);font-size:44px;color:var(--gold);text-shadow:3px 3px 0 #8A5A00,-1px -1px 0 #8A5A00;font-variant-numeric:tabular-nums}
.rstats{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;font-size:20px}
.rstats b{font-family:'Press Start 2P',var(--f-sans);font-size:16px;color:var(--blue)}
.rrank{min-height:30px;font-size:22px;font-weight:700;color:var(--red)}
.rrank.show{animation:pulse .6s ease-in-out 2}

/* 排行榜：街機風格 */
.arcade{background:#05050f;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 2px,transparent 2px 4px);border:4px solid #2a2a6a;box-shadow:0 0 0 4px #000,0 10px 0 #000;border-radius:6px;padding:22px 14px;color:#fff;display:flex;flex-direction:column;gap:12px;align-items:center}
.atitle{font-family:'Press Start 2P',var(--f-sans);font-size:clamp(22px,6vw,40px);letter-spacing:4px;background:linear-gradient(#FFF27A 0%,#FFB020 50%,#FF4A1A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(3px 3px 0 #7A0000);text-align:center}
.asub{color:#9FE8FF;font-size:18px;text-align:center}
.asub .zy{color:#9FE8FF}
.atable{width:100%;max-width:720px;overflow-x:auto}
.arow{display:grid;grid-template-columns:4.2em 6.4em minmax(5em,1fr) 4.2em 4.6em;gap:6px;align-items:center;font-family:'Press Start 2P','Noto Sans TC',var(--f-sans);font-size:clamp(10px,2.4vw,16px);color:var(--c,#fff);padding:7px 6px;min-width:440px;animation:slideIn .35s steps(6) both;animation-delay:calc(var(--i,0) * 110ms)}
.arow span:nth-child(2),.arow span:nth-child(4),.arow span:nth-child(5){text-align:right}
.arow.ahead{color:#7f7fbf;font-size:clamp(9px,2vw,13px);animation:none;border-bottom:2px dashed #2a2a6a}
.arow.hl{animation:slideIn .35s steps(6) both,blink .8s steps(2) infinite;animation-delay:calc(var(--i,0) * 110ms),1.4s;background:rgba(255,255,255,.08)}
.arow .an{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes slideIn{from{transform:translateX(60%);opacity:0}to{transform:none;opacity:1}}
@keyframes blink{50%{color:transparent}}
.aempty{font-family:'Press Start 2P',var(--f-sans);color:#7f7fbf;padding:20px 0;text-align:center;font-size:14px}
.aselect{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.aselect select{font:inherit;font-size:16px;padding:8px 10px;border-radius:8px;border:2px solid #2a2a6a;background:#11112a;color:#fff;min-height:44px}
.arcade .btn{background:#FFD23F;border-color:#000;box-shadow:0 4px 0 #000;color:#000}

/* 像素角色 */
.spr{display:block;image-rendering:pixelated}
.spr.sm{width:22px;height:26px}
.spr.xs{width:14px;height:16px;display:inline-block;vertical-align:-3px;margin-right:6px}
.spr.lg{width:54px;height:63px}
.whob{display:flex;flex-direction:column;align-items:center;gap:8px}
.hbtn.player{gap:8px}
.starstage{position:relative;width:100%;max-width:440px;padding-bottom:104px}
.hero{position:absolute;left:0;bottom:0;width:66px;height:77px;transition:transform .35s ease-in-out}
.hero .spr{width:100%;height:100%}
.hero.jump{animation:hjump .45s ease-out}
.hero.cheer{animation:hjump .45s ease-out 4}
.hero.sad{animation:hsad .7s ease-in-out}
.hero.idle{animation:hbob 1.1s ease-in-out infinite}
@keyframes hjump{0%{translate:0 0}45%{translate:0 -80px}100%{translate:0 0}}
@keyframes hsad{25%{rotate:-12deg}75%{rotate:12deg}}
@keyframes hbob{50%{translate:0 -6px}}
.arcade.mini{width:100%;max-width:640px;padding:14px 8px;gap:8px}
.arcade.mini .atitle{font-size:18px;letter-spacing:3px}
/* 寫寫看倒數條 */
.wbar{width:100%;max-width:240px;height:10px;border-radius:999px;background:var(--card);border:2px solid var(--line);overflow:hidden}
.wbar i{display:block;height:100%;width:100%;background:var(--gold);transition:width .2s linear}

/* 倒數 3-2-1 */
.cdown{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(10,20,40,.45)}
.cdown span{font-family:'Press Start 2P',var(--f-sans);font-size:clamp(70px,22vw,160px);color:#FFD23F;text-shadow:6px 6px 0 #B4460E,-2px -2px 0 #000;animation:cd .8s ease-out both}
.cdown span.go{color:#7CFF4A;text-shadow:6px 6px 0 #1A6B2E,-2px -2px 0 #000}
@keyframes cd{0%{transform:scale(2.4);opacity:0}30%{transform:scale(.9);opacity:1}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}

/* 彩紙特效畫布 */
canvas.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

@media (prefers-reduced-motion:reduce){
  .sw.on .s3,.glow,.spk,.cloud,.balloon .bsw,.balloon .str,.sun,.arow,.mbtn,.tile{animation:none!important}
  .sw{opacity:1;transform:none}
  .hero{transition:none}
  .balloon{animation:none;top:auto;bottom:var(--rest)}
  .card .in,.tile,.timer i{transition:none}
  .tile.hint{animation:none}
  .shake{animation:none}
}

  function starSVG(on,size){return '<svg viewBox="0 0 24 24" aria-hidden="true"'+(size?' width="'+size+'" height="'+size+'"':'')+'><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z" fill="'+(on?'var(--gold)':'var(--grid)')+'" stroke="'+(on?'#9A6A08':'var(--line)')+'" stroke-width="1.2" stroke-linejoin="round"/></svg>';}

  function startWrite(){ G={kind:'write',items:pickUnique(5),i:0,stars:0,ok:0,trace:true}; G.par=G.items.length*PAR.write; writeRound(); }
  // 聽寫考試：藍圈範圍全部考，順序打亂，像老師考聽寫
  function startDict(){ G={kind:'exam',dict:true,items:shuffle(BANK.quiz),i:0,stars:0,ok:0,trace:false,miss:[]}; G.par=G.items.length*PAR.exam; writeRound(); }
  function startExam(){ var seenW={}; G={kind:'exam',items:shuffle(pool()).filter(function(it){ if(Array.from(it.word).length<2) return false; if(seenW[it.word]) return false; seenW[it.word]=1; return true; }).slice(0,8),i:0,stars:0,ok:0,trace:false}; G.par=G.items.length*PAR.exam; writeRound(); }

  function writeRound(){
    var item=G.items[G.i], exam=G.kind==='exam';
    setProg((G.i+1)+' / '+G.items.length);
    var syls = exam ? wordSyls(item) : [sylOf(item.c,item.a)];
    var W={item:item,syls:syls,strokes:[],cur:null,done:false,exam:exam,ts:Date.now(),
      target: exam ? item.ctx.split(' ').indexOf('*') : 0};
    G.w=W;
    if(exam){
      var p=$('prompt'); p.hidden=false;
      p.innerHTML='<div class="pbtns"><button class="speak" id="speakBtn" type="button" aria-label="再聽一次">'+SPEAKER+'</button>'+
        '<button class="slow" id="slowBtn" type="button">'+T(TXT.slow)+'</button></div>'+
        '<div class="pword"><div class="pchar" id="pchar">？</div><div class="pctx" id="pctx">'+T(WT.examListen)+'</div><div class="pcue" id="pcue"></div></div>';
      $('speakBtn').onclick=function(){speak(item.word);};
      $('slowBtn').onclick=function(){speak(item.word,0.45);};
      // 聽寫考試像老師一樣：「第 1 題，龜兔賽跑，龜兔賽跑。」
      if(G.dict) speak('第'+(G.i+1)+'題，'+item.word+'。'+item.word+'。',0.7);
      else speak(item.word);
    } else {
      renderPrompt(item);
    }
    $('stage').innerHTML='<div class="write">'+
      '<canvas id="wc" aria-label="手寫區"></canvas>'+
      '<div class="wside"><p class="winst">'+T(exam?WT.instExam:WT.inst)+'</p>'+
      (exam?'':'<div class="wbar" aria-hidden="true"><i id="wbarI"></i></div><p class="winst" style="font-size:16px;color:var(--ink-soft)">'+T(WT.hint)+'</p>')+
      '<button class="btn" id="wClear" type="button">'+T(WT.clear)+'</button>'+
      '<button class="btn go" id="wSubmit" type="button">'+T(WT.submit)+'</button></div>'+
      '<div class="wres" id="wres" aria-live="polite"></div></div>';

    var cv=$('wc'), dpr=window.devicePixelRatio||1;
    // 直式：一個字的注音由上往下寫，詞的下一個字接在下面
    // 詞越長格子越小，四個字的「龜兔賽跑」也放得下
    var nSym=syls.reduce(function(a,s){return a+Math.max(1,s.syms.length);},0);
    var slotH=exam?Math.max(54,Math.min(82,Math.floor(620/nSym))):130;
    var colW=exam?Math.round(slotH*1.36):170, toneW=exam?Math.round(slotH*0.56):70;
    var band=Math.round(slotH*0.34), yy=0;
    syls.forEach(function(s){ s.y0=yy; s.band=s.light?band:0; s.n=Math.max(1,s.syms.length); yy+=s.band+slotH*s.n; });
    var cw=colW+toneW, ch=yy;
    cv.style.width=cw+'px'; cv.style.height='auto';
    cv.width=cw*dpr; cv.height=ch*dpr;
    var ctx=cv.getContext('2d');
    var KAI="'LXGW WenKai TC','BiauKai','DFKai-SB',serif";

    function guide(c){
      c.save();
      c.strokeStyle='#BFD3B6'; c.lineWidth=1.5;
      c.beginPath(); c.moveTo(colW,0); c.lineTo(colW,ch); c.stroke();
      syls.forEach(function(s,i){
        var y0=s.y0, top=y0+s.band, y1=top+slotH*s.n;
        c.setLineDash([]);
        if(i>0){ c.strokeStyle='#8FAF86'; c.lineWidth=3; c.beginPath(); c.moveTo(0,y0); c.lineTo(cw,y0); c.stroke(); }
        c.strokeStyle='#BFD3B6'; c.lineWidth=1.5;
        // 右邊聲調欄也畫成一格一格，跟左邊每個符號對齊
        if(s.band){ c.beginPath(); c.moveTo(0,top); c.lineTo(cw,top); c.stroke(); }
        for(var k=1;k<s.n;k++){ c.beginPath(); c.moveTo(0,top+slotH*k); c.lineTo(cw,top+slotH*k); c.stroke(); }
        c.setLineDash([4,5]); c.strokeStyle='#D7E7CF';
        for(var q=0;q<s.n;q++){ c.beginPath(); c.moveTo(colW,top+slotH*q+slotH/2); c.lineTo(cw,top+slotH*q+slotH/2); c.stroke(); }
        c.setLineDash([]); c.strokeStyle='#BFD3B6';
        c.setLineDash([5,6]); c.strokeStyle='#D7E7CF';
        c.beginPath(); c.moveTo(colW/2,top); c.lineTo(colW/2,y1); c.stroke();
        for(var j=0;j<s.n;j++){ c.beginPath(); c.moveTo(0,top+slotH*j+slotH/2); c.lineTo(colW,top+slotH*j+slotH/2); c.stroke(); }
      });
      c.restore();
    }
    function glyphs(c,fill,lw){
      c.save(); c.fillStyle=fill; c.strokeStyle=fill; c.lineWidth=lw||1; c.lineJoin='round'; c.textAlign='center'; c.textBaseline='middle';
      syls.forEach(function(s){
        var top=s.y0+s.band;
        c.font='700 '+Math.round(slotH*0.74)+'px '+KAI;
        s.syms.forEach(function(sym,k){ var x=colW/2,y=top+slotH*k+slotH/2+4; c.fillText(sym,x,y); if(lw) c.strokeText(sym,x,y); });
        c.font='700 '+Math.round(slotH*0.5)+'px '+KAI;
        if(s.light){ c.fillText('˙',colW/2,s.y0+s.band/2); if(lw) c.strokeText('˙',colW/2,s.y0+s.band/2); }
        if(s.tone){ var tx=colW+toneW/2-4, ty=top+slotH*(s.n-1)+slotH/2; c.fillText(s.tone,tx,ty); if(lw) c.strokeText(s.tone,tx,ty); }
      });
      c.restore();
    }
    function traceAlpha(){
      if(exam||W.reveal) return 0;
      var e=(Date.now()-W.ts)/1000;
      if(e<10) return 0;
      return Math.min(1,(e-10)/(W.limit-10))*0.24;
    }
    function traceText(c){
      c.save(); c.fillStyle='rgba(30,91,168,.16)'; c.textAlign='center'; c.textBaseline='middle';
      syls.forEach(function(s){
        var top=s.y0+s.band;
        c.font='700 '+Math.round(slotH*0.74)+'px '+KAI;
        s.syms.forEach(function(sym,k){ c.fillText(sym,colW/2,top+slotH*k+slotH/2+4); });
        if(s.light){ c.font='700 '+Math.round(slotH*0.5)+'px '+KAI; c.fillText('˙',colW/2,s.y0+s.band/2); }
        if(s.tone){ c.font='700 '+Math.round(slotH*0.5)+'px '+KAI; c.fillText(s.tone,colW+toneW/2-4,top+slotH*(s.n-1)+slotH/2); }
      });
      c.restore();
    }
    function ink(c,lw,col){
      c.save(); c.strokeStyle=col||'#2E2B24'; c.lineWidth=lw||(exam?8:9); c.lineCap='round'; c.lineJoin='round';
      W.strokes.forEach(function(st){
        c.beginPath(); c.moveTo(st[0][0],st[0][1]);
        if(st.length===1) c.lineTo(st[0][0]+0.1,st[0][1]);
        for(var i=1;i<st.length;i++) c.lineTo(st[i][0],st[i][1]);

      });
      c.restore();
    }
    function redraw(){
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.fillStyle='#FBF7EE'; ctx.fillRect(0,0,cw,ch);
      guide(ctx);
      var al=traceAlpha(); if(al>0.004) glyphs(ctx,'rgba(30,91,168,'+al.toFixed(3)+')');

    }
    W.exportBlob=function(){
      return new Promise(function(res){
        var o=document.createElement('canvas'); o.width=cw*2; o.height=ch*2;
        var c=o.getContext('2d'); c.setTransform(2,0,0,2,0,0);
        c.fillStyle='#FFFFFF'; c.fillRect(0,0,cw,ch); guide(c); ink(c);
        o.toBlob(function(b){res(b);},'image/png');

    };
    function pt(e){var r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cw/r.width,(e.clientY-r.top)*ch/r.height];}
    cv.addEventListener('pointerdown',function(e){ if(W.done) return; e.preventDefault(); try{cv.setPointerCapture(e.pointerId);}catch(x){} W.cur=[pt(e)]; W.strokes.push(W.cur); redraw(); });

      function cnt(x0,y0,w,h){
        var r={I:0,IT:0,T:0,TI:0}, ya=Math.max(0,Math.floor(y0)), yb=Math.min(ch,Math.floor(y0+h)), xa=Math.max(0,Math.floor(x0)), xb=Math.min(cw,Math.floor(x0+w));
        for(var y=ya;y<yb;y++) for(var x=xa;x<xb;x++){ var i=(y*cw+x)*4+3; if(Im[i]>40){r.I++; if(Tdm[i]>40) r.IT++;} if(Tm[i]>40){r.T++; if(Idm[i]>40) r.TI++;} }
        return r;
      }
      var g=cnt(0,0,cw,ch), pr=g.I?g.IT/g.I:0, rc=g.T?g.TI/g.T:0, f=(pr+rc)?2*pr*rc/(pr+rc):0;
      var score=Math.round(Math.min(1,f*1.12)*100), tips=[];
      syls.forEach(function(sy){
        var top=sy.y0+sy.band, cells=[];
        sy.syms.forEach(function(sym,k){ cells.push({x:0,y:top+slotH*k,w:colW,h:slotH,name:sym}); });
        if(sy.tone) cells.push({x:colW,y:top+slotH*(sy.n-1),w:toneW,h:slotH,name:'聲ㄕㄥ 調ㄉㄧㄠˋ'});
        if(sy.light) cells.push({x:0,y:sy.y0,w:colW,h:sy.band,name:'輕ㄑㄧㄥ 聲ㄕㄥ 點ㄉㄧㄢˇ'});
        cells.forEach(function(c){
          var q=cnt(c.x,c.y,c.w,c.h), cp=q.I?q.IT/q.I:0, cr=q.T?q.TI/q.T:0;
          if(!q.I) tips.push(c.name+' 還ㄏㄞˊ 沒ㄇㄟˊ 寫ㄒㄧㄝˇ');
          else if(cr<0.55) tips.push(c.name+' 少ㄕㄠˇ 了˙ㄌㄜ 筆ㄅㄧˇ 畫ㄏㄨㄚˋ ， 或ㄏㄨㄛˋ 是ㄕˋ 寫ㄒㄧㄝˇ 太ㄊㄞˋ 小ㄒㄧㄠˇ');
          else if(cp<0.55) tips.push(c.name+' 多ㄉㄨㄛ 了˙ㄌㄜ 筆ㄅㄧˇ 畫ㄏㄨㄚˋ ， 或ㄏㄨㄛˋ 是ㄕˋ 寫ㄒㄧㄝˇ 歪ㄨㄞ 了˙ㄌㄜ');
        });
      });
      return {score:score,tips:tips.slice(0,2)};
    };
    if(G.wiv) clearInterval(G.wiv);
    G.wiv=setInterval(function(){
      if(!G||G.w!==W||W.done) return;
      var e=(Date.now()-W.ts)/1000;
      if(!exam){ var bi=$('wbarI'); if(bi) bi.style.width=Math.max(0,(W.limit-e)/W.limit*100)+'%'; }

    redraw();
  }

  function submitWrite(){
    var W=G&&G.w; if(!W||W.done) return;
    if(!W.strokes.length){ $('wres').innerHTML='<div class="wcard"><div class="wverdict no">'+T(WT.empty)+'</div></div>'; shake($('wc')); return; }
    W.done=true; $('wSubmit').disabled=true; $('wClear').disabled=true;
    G.wsec=(G.wsec||0)+(Date.now()-W.ts)/1000;
    var sim=W.sim(); W.reveal=true; W.redraw();
    if(!W.exam){ showWriteResult(W,{corr:[sim.score>=55],score:sim.score,praise:praiseFor(sim.score),tips:sim.tips,parent:null}); return; }

  }

  function praiseFor(sc){
    return sc>=90?'寫ㄒㄧㄝˇ 得˙ㄉㄜ 好ㄏㄠˇ 漂ㄆㄧㄠˋ 亮˙ㄌㄧㄤ ！':sc>=75?'寫ㄒㄧㄝˇ 得˙ㄉㄜ 很ㄏㄣˇ 好ㄏㄠˇ ！':sc>=55?'不ㄅㄨˊ 錯ㄘㄨㄛˋ ， 再ㄗㄞˋ 整ㄓㄥˇ 齊ㄑㄧˊ 一ㄧˋ 點ㄉㄧㄢˇ':'再ㄗㄞˋ 試ㄕˋ 一ㄧˊ 次ㄘˋ ， 照ㄓㄠˋ 著˙ㄓㄜ 格ㄍㄜˊ 子˙ㄗ 寫ㄒㄧㄝˇ';
  }
  function aiGrade(W,sim){

    var prompt=[
      '你是台灣國小一年級的注音老師，說話溫和、具體。',
      '圖片是一位小一學生用手指在平板上寫的注音。'+(n>1?'他聽到「'+item.word+'」這個詞，要由上往下、一格寫一個字的注音（第1格在最上面），粗綠橫線分開每一格。':'題目要他寫「'+item.c+'」（'+item.word+'）的注音。'),
      '每一格裡注音由上往下直寫，右邊窄欄寫聲調'+(W.syls.some(function(s){return s.light;})?'，輕聲字那一格最上面的窄列是寫輕聲點的地方':'')+'；淡綠色線是格線，不是他寫的。',
      '正確答案：',
      list,
      '請判斷：',
      '1. correct：長度 '+n+' 的陣列，每一格寫的是否就是正確答案。符號、順序、聲調都要對；字歪一點但看得出是對的符號就算對。相似符號寫錯（例如 ㄕ 寫成 ㄙ、ㄢ 寫成 ㄤ）或聲調寫錯都算錯。',

      '3. score：書寫好看程度 0 到 100 的整數。看筆畫數和形狀、該出頭或不出頭、大小比例、有沒有寫在格子中間、聲調位置。小一學生用手指寫，標準不要太嚴，但要誠實，亂畫就給低分。',
      '4. praise：一句具體的鼓勵。tips：最多 2 個具體改進建議，說哪個符號、哪一筆、怎麼改（例如：ㄕ 上面的短橫要寫在最上面）。都寫對又好看時 tips 可以是空陣列。',
      'praise 和 tips 是給小朋友看的：每個國字後面緊接著寫它的注音（台灣教育部標準，輕聲用˙寫在前面，一、不 寫變調後的音），字和字之間用一個空格分開，標點也用空格隔開，注音符號本身直接寫。例如：寫ㄒㄧㄝˇ 得˙ㄉㄜ 很ㄏㄣˇ 整ㄓㄥˇ 齊ㄑㄧˊ ！',
      '5. parent：給家長的一句話，一般中文即可。',
      '只回覆一個 JSON 物件，例如：{"read":["…"],"correct":[true],"score":80,"praise":"…","tips":["…"],"parent":"…"}'
    ].join('\n');
    W.exportBlob().then(function(blob){
      return SAMPLE.json(prompt,{images:blob,modelTier:'default',cache:false});
    }).then(function(r){
      if(!G||G.w!==W) return;
      var corr=W.syls.map(function(_,i){ var c=r&&r.correct; return Array.isArray(c)?!!c[i]:!!c; });
      var score=sim?sim.score:Math.max(0,Math.min(100,parseInt(r&&r.score,10)||0));
      showWriteResult(W,{corr:corr,score:score,praise:r&&r.praise,tips:(r&&Array.isArray(r.tips))?r.tips.slice(0,2):[],parent:r&&r.parent});
    }).catch(function(e){
      if(!G||G.w!==W) return;
      var code=e&&e.code;
      var msg = code==='not_granted'||code==='sampling_disabled'||code==='images_unavailable'||code==='capability_disabled' ? '這次沒有開放 AI 評分，請爸媽對照後打分。'
        : code==='rate_limited' ? 'AI 評分暫時太忙，請爸媽先對照打分，晚一點再試。'
        : 'AI 評分沒有成功，請爸媽先對照打分。';
      if(code==='not_granted'||code==='sampling_disabled'||code==='images_unavailable') SAMPLE_IMG=false;
      parentGrade(W,msg,sim);
    });
  }

  function revealWord(W){
    $('pchar').innerHTML = W.exam ? wordHTML(W.syls) : zy(W.item.c,W.item.a);
    $('pctx').innerHTML = W.exam ? '' : ctxHTML(W.item,true);
  }

  function showWriteResult(W,r){
    var item=W.item, allOk=r.corr.every(Boolean);
    var stars = !allOk ? 1 : (r.score>=85?3:(r.score>=65?2:1));
    mark(item, r.corr[W.target]);
    G.stars+=stars; if(allOk) G.ok++; else if(G.miss) G.miss.push(item); G.neatSum=(G.neatSum||0)+r.score; G.neatN=(G.neatN||0)+1;
    if(allOk) later(function(){ burstAt($('wres').querySelector('.score'),26); },100);
    var st=''; for(var i=0;i<3;i++) st+=starSVG(i<stars);
    var cells='<span class="tt">'+W.syls.map(function(s,i){
      return '<span class="wcell '+(r.corr[i]?'ok':'no')+'">'+zy(s.c,s.z)+'</span>';
    }).join('')+'</span>';
    var verdict = allOk ? '<div class="wverdict ok">'+T(WT.right)+'<span class="big">'+cells+'</span></div>'
      : '<div class="wverdict no">'+T(W.exam?WT.wrong2:WT.wrong)+'<span class="big">'+cells+'</span></div>'+
        (!r.corr[W.target]&&cueFor(item)?'<div class="pcue">'+cueHTML(item)+'</div>':'');
    $('wres').innerHTML='<div class="wcard">'+
      '<div class="wtop"><span class="score">'+r.score+'</span>'+T(WT.score)+'<span class="wstars">'+st+'</span></div>'+
      verdict+
      (r.praise?'<div class="praise">'+T(r.praise)+'</div>':'')+
      (r.tips&&r.tips.length?'<ul class="tips">'+r.tips.map(function(t){return '<li>'+T(t)+'</li>';}).join('')+'</ul>':'')+
      (r.parent?'<p class="pnote">給爸媽：'+esc(r.parent)+'</p>':'')+
      '<div class="btnrow" style="justify-content:flex-start"><button class="btn primary" id="wNext" type="button">'+T(WT.next)+'</button></div></div>';
    revealWord(W);
    blip(allOk);
    var say=plainOf(r.praise); if(say) speak(say,0.9);
    $('wNext').onclick=nextWrite;
  }

  function parentGrade(W,msg,sim){
    var item=W.item;
    $('wres').innerHTML='<div class="wcard">'+
      (sim?'<div class="wtop"><span class="score">'+sim.score+'</span>'+T(WT.score)+'</div>':'')+
      '<div class="wverdict">'+T(WT.compare)+'<span class="big">'+wordHTML(W.exam?W.syls:[sylOf(item.c,item.a)])+'</span></div>'+
      '<p class="pnote">'+esc(msg||'給爸媽：這個畫面目前不能使用 AI 評分（要在 Claude 裡開啟這個頁面，並在跳出的視窗按允許）。請對照正確寫法打分。')+'</p>'+
      '<div class="praise">'+T(WT.parent)+'</div>'+
      '<div class="rate">'+[1,2,3].map(function(n){return '<button class="btn" type="button" data-s="'+n+'" aria-label="'+n+' 顆星">'+Array.apply(null,{length:n}).map(function(){return starSVG(true,26);}).join('')+'</button>';}).join('')+
      '<button class="btn" type="button" data-s="0">'+T(WT.wrongBtn)+'</button></div></div>';
    revealWord(W);
    speak(W.exam?item.word:item.say);
    $('wres').querySelector('.rate').onclick=function(e){
      var b=e.target.closest('button'); if(!b) return;
      var s=parseInt(b.dataset.s,10);
      mark(item,s>0); G.stars+=Math.max(1,s); if(s>0) G.ok++; else if(G.miss) G.miss.push(item); if(sim){ G.neatSum=(G.neatSum||0)+sim.score; G.neatN=(G.neatN||0)+1; }
      blip(s>0);
      nextWrite();
    };
  }

  function nextWrite(){
    G.i++;
    var n=G.items.length;
    if(G.i>=n){
      if(G.kind==='exam'){
        var ratio=G.ok/n;
        // 聽寫考試：列出寫錯的詞，回家再練
        var missT = (G.miss&&G.miss.length) ? ' ， 要ㄧㄠˋ 再ㄗㄞˋ 練ㄌㄧㄢˋ ： '+G.miss.map(function(it){ return wordSyls(it).map(function(y){return y.c+y.z;}).join(' '); }).join(' 、 ') : '';
        finish(ratio>=0.9?3:(ratio>=0.6?2:1),'寫ㄒㄧㄝˇ 對ㄉㄨㄟˋ '+G.ok+' 題ㄊㄧˊ ， 共ㄍㄨㄥˋ '+n+' 題ㄊㄧˊ'+missT,{acc:ratio,neat:G.neatN?G.neatSum/G.neatN:null,sec:G.wsec||0});
      } else {
        finish(Math.max(1,Math.min(3,Math.round(G.stars/n))),'寫ㄒㄧㄝˇ 了˙ㄌㄜ '+n+' 個˙ㄍㄜ 字ㄗˋ',{acc:G.ok/n,neat:G.neatN?G.neatSum/G.neatN:null,sec:G.wsec||0});
      }
      return;
    }
    writeRound();
  }

  function drawLines(){
    var svg=$('mlines'), box=$('mz'); if(!svg||!box||!G||!G.lines) return;
    var bb=box.getBoundingClientRect();
    svg.innerHTML=G.lines.map(function(l){
      var a=l[0].getBoundingClientRect(), b=l[1].getBoundingClientRect();
      var x1=a.right-bb.left, y1=a.top+a.height/2-bb.top, x2=b.left-bb.left, y2=b.top+b.height/2-bb.top;
      var cls=l[3]?' class="new"':''; l[3]=false;
      return '<line'+cls+' pathLength="1" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+l[2]+'" stroke-width="6" stroke-linecap="round"/><circle cx="'+x1+'" cy="'+y1+'" r="7" fill="'+l[2]+'"/><circle cx="'+x2+'" cy="'+y2+'" r="7" fill="'+l[2]+'"/>';
    }).join('');
  }
})();
</script>

</body></html>
